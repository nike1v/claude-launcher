name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate every release build on the test suite. The v0.4.1 → v0.4.2
  # regression (a TDZ ReferenceError that crashed the main process at
  # boot, presenting as a blank sidebar in the wild) would have been
  # caught here by tests/integration/ipc-handlers-boot.test.ts, which
  # runs registerIpcHandlers() with stubbed electron and asserts the
  # full surface registers without throwing. If `verify` fails, no
  # platform builds run, no artifacts upload, no release publishes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pnpm install
      # Type-check via the project references *before* tests. Catches the
      # whole class of "renamed a field" / "JSX namespace" / "discriminated
      # union" bugs that vitest can't see (it runs the bundler, not tsc).
      # Cheap to gate on — adds ~3 s on a warm cache.
      - run: pnpm exec tsc -b
      - run: pnpm test

  build-linux:
    needs: verify
    runs-on: ubuntu-latest
    # Safety net against a wedged build step (see the v0.7.30 @electron/rebuild
    # hang); a healthy build is a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      # node-pty compiles from source during install on linux (no prebuild
      # shipped); its node-gyp needs Python < 3.12 (distutils). Pin 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install

      # npmRebuild is off (electron-builder can't rebuild node-pty against the
      # VS-2026 windows runner without hanging @electron/rebuild 3.6.1), so the
      # install-step native binary is load-bearing. node-pty is Node-API, so it
      # loads under Electron too — fail in seconds here if the binary is broken.
      - name: Verify node-pty native binary loads
        run: node -e "require('node-pty'); console.log('node-pty ok')"

      - name: Build
        run: pnpm exec electron-vite build && pnpm exec electron-builder --linux --publish never

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v3
        with:
          # Tags like v0.3.0-alpha.1 / v0.3.0-rc.1 → GitHub prerelease, which
          # keeps electron-updater (releaseType: 'release') from offering it
          # to users on the stable channel.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.AppImage
            dist/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install

      - name: Verify node-pty native binary loads
        run: node -e "require('node-pty'); console.log('node-pty ok')"

      - name: Build
        run: pnpm exec electron-vite build && pnpm exec electron-builder --win --publish never

      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10.33.2

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pnpm install

      - name: Verify node-pty native binary loads
        run: node -e "require('node-pty'); console.log('node-pty ok')"

      # When the Apple secrets exist, CSC_LINK auto-discovers the Developer ID
      # cert and we enable the hardened runtime + entitlements + notarization.
      # Otherwise build UNSIGNED (CSC_IDENTITY_AUTO_DISCOVERY=false) — the
      # electron-builder-25 ad-hoc signer ("identity -") throws "not a file" on
      # the current macOS runner, and an unsigned build needs the same xattr
      # workaround anyway (see docs/mac-signing.md). package.json sets no mac
      # identity so both paths are driven from here.
      - name: Build
        run: |
          pnpm exec electron-vite build
          if [ -n "$APPLE_ID" ] && [ -n "$CSC_LINK" ]; then
            echo "Apple signing secrets present — building signed + notarized."
            pnpm exec electron-builder --mac --publish never \
              -c.mac.hardenedRuntime=true \
              -c.mac.gatekeeperAssess=false \
              -c.mac.entitlements=build/entitlements.mac.plist \
              -c.mac.entitlementsInherit=build/entitlements.mac.plist \
              -c.mac.notarize=true
          else
            echo "::warning::Apple signing secrets not set — building UNSIGNED mac artifacts; downloads need the xattr workaround in docs/mac-signing.md. Add secrets for a notarized build."
            CSC_IDENTITY_AUTO_DISCOVERY=false pnpm exec electron-builder --mac --publish never
          fi
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS artifacts to release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
