# pnpm 10 moved the build-script allowlist out of package.json's "pnpm"
# field into here. Without it, pnpm refuses to run these packages' install
# scripts and fails with ERR_PNPM_IGNORED_BUILDS (node-pty's native pty.node
# never builds, breaking the app and the CI release gate).
onlyBuiltDependencies:
  - electron
  - esbuild
  - node-pty

# node-pty 1.1.0 pins node-gyp 9.4.1, whose imported distutils is gone in
# Python 3.12; node-gyp 11 supports node 24 and Python 3.11. This only governs
# node-pty's *install-time* compile on linux (win/mac use its shipped
# prebuilds). The Electron-ABI rebuild is disabled entirely via
# build.npmRebuild=false — node-pty is Node-API, so the install-built binary
# loads under Electron without recompiling (which also sidesteps the
# @electron/rebuild 3.6.1 + node-gyp >=10 promise-API hang and the VS-2026
# windows toolchain gap).
overrides:
  node-gyp: ^11.0.0
